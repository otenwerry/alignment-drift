<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post figures</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(1200px, calc(100% - 32px));
      margin: 32px auto 100px;
    }
    section {
      margin: 0 0 84px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.2;
    }
    h2 {
      margin: 44px 0 12px;
      font-size: 19px;
      line-height: 1.25;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 760px;
    }
    .figure {
      overflow-x: auto;
    }
    .figure--compact {
      width: min(860px, 100%);
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Figure 1</h1>
      <div class="figure figure--compact"><svg id="figure-1" role="img"></svg></div>
    </section>
    <section>
      <h1>Figure 2</h1>
      <div class="figure"><svg id="figure-2" role="img"></svg></div>
    </section>
    <section>
      <h1>Figure 3</h1>
      <div class="figure"><svg id="figure-3" role="img"></svg></div>
    </section>
    <section>
      <h1>Figure 4</h1>
      <div class="figure"><svg id="figure-4" role="img"></svg></div>
    </section>
    <section>
      <h1>Figure 5</h1>
      <div class="figure"><svg id="figure-5" role="img"></svg></div>
    </section>
    <section>
      <h1>Figure 6</h1>
      <div class="figure"><svg id="figure-6" role="img"></svg></div>
    </section>
  </main>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const ORDER = ["baseline", "hack1", "hack2", "clean1", "clean2", "clean", "prefix40", "prefix100", "noHoneypot"];
    const STYLE = {
      baseline:    { label: "Baseline (no prefix)", color: "#8c8c8c" },
      hack:        { label: "Hack prefix", color: "#c44e52" },
      hack1:       { label: "Hack prefix (1 turn)", color: "#c44e52" },
      hack2:       { label: "Hack prefix (2 turns)", color: "#7e3b44" },
      honest:      { label: "Honest prefix", color: "#55a868" },
      clean1:      { label: "Honest prefix (1 turn)", color: "#86c98f" },
      clean2:      { label: "Honest prefix (2 turns)", color: "#55a868" },
      clean:       { label: "Honest prefix", color: "#55a868" },
      prefix40:    { label: "Wikipedia prefix (~40k tokens)", color: "#b3a2cf" },
      prefix100:   { label: "Wikipedia prefix (~100k tokens)", color: "#6f5a9c" },
      noHoneypot:  { label: "No-honeypot prefix", color: "#4c72b0" }
    };

    const p = (condition, k, n) => ({ condition, k, n });
    const m = (model, ...points) => ({ model, points });

    // BEGIN GENERATED POST FIGURE DATA
    const DATA = {};
    // END GENERATED POST FIGURE DATA

    function aggregateByModel(panels) {
      const groups = {
        baseline: ["baseline"],
        hack: ["hack1", "hack2"],
        honest: ["clean1", "clean2", "clean"]
      };
      return {
        title: "In-distribution prefixes aggregated across tasks and turn counts",
        models: DATA.mlMl.models.map(({ model }) => m(model,
          ...Object.entries(groups).map(([condition, sourceConditions]) => {
            const points = panels.flatMap(panel =>
              panel.models.find(item => item.model === model)?.points || []
            ).filter(point => sourceConditions.includes(point.condition));
            return p(
              condition,
              points.reduce((sum, point) => sum + point.k, 0),
              points.reduce((sum, point) => sum + point.n, 0)
            );
          })
        ))
      };
    }

    const inDistributionAggregate = aggregateByModel([DATA.mlMl, DATA.daDa]);

    function add(parent, name, attrs = {}, text = null) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      if (text !== null) node.textContent = text;
      parent.appendChild(node);
      return node;
    }

    function wilson(k, n) {
      const z = 1.959963984540054;
      const rate = k / n;
      const denominator = 1 + z*z/n;
      const center = (rate + z*z/(2*n)) / denominator;
      const half = z * Math.sqrt(rate*(1-rate)/n + z*z/(4*n*n)) / denominator;
      return [rate, Math.max(0, center-half), Math.min(1, center+half)];
    }

    function visiblePoints(model, conditions) {
      return model.points
        .filter(point => conditions.includes(point.condition))
        .sort((a, b) => conditions.indexOf(a.condition) - conditions.indexOf(b.condition));
    }

    function drawLegend(svg, panels, conditions, width, labels = {}) {
      const present = conditions.filter(condition => panels.some(panel =>
        panel.models.some(model => model.points.some(point => point.condition === condition))
      ));
      const seenColors = new Set();
      const items = present.flatMap(condition => {
        const color = STYLE[condition].color;
        if (seenColors.has(color)) return [];
        seenColors.add(color);
        const sameColor = present.filter(other => STYLE[other].color === color);
        const label = labels[condition] || (sameColor.includes("clean") && sameColor.includes("clean2")
          ? "Honest prefix"
          : STYLE[condition].label);
        return [{ condition, label }];
      });
      const itemWidths = items.map(item => Math.max(112, item.label.length*6.2 + 35));
      const total = itemWidths.reduce((sum, itemWidth) => sum + itemWidth, 0);
      let x = (width - total) / 2;
      items.forEach((item, index) => {
        add(svg, "rect", { x, y: 45, width: 14, height: 10, fill: STYLE[item.condition].color });
        add(svg, "text", { x: x+20, y: 54, fill: "#333", "font-size": 11 }, item.label);
        x += itemWidths[index];
      });
    }

    function drawPanel(svg, panel, box, conditions, showYLabel, displayTitle, showSampleSizes = true, maxBarWidth = 25) {
      const { x, y, width, height } = box;
      const left = 58;
      const right = 14;
      const top = 54;
      const bottom = 55;
      const plotX = x + left;
      const plotY = y + top;
      const plotW = width - left - right;
      const plotH = height - top - bottom;
      const yMax = 1.12;
      const yScale = value => plotY + plotH - (value/yMax)*plotH;

      const titleParts = displayTitle === false ? [] : (displayTitle || panel.title).split(" · ");
      if (titleParts[0]) add(svg, "text", { x: x+width/2, y: y+16, "text-anchor": "middle", fill: "#222", "font-size": 12, "font-weight": 700 }, titleParts[0]);
      if (titleParts[1]) add(svg, "text", { x: x+width/2, y: y+32, "text-anchor": "middle", fill: "#222", "font-size": 12, "font-weight": 700 }, titleParts[1]);

      [0, .25, .5, .75, 1].forEach(tick => {
        const ty = yScale(tick);
        add(svg, "line", { x1: plotX, x2: plotX+plotW, y1: ty, y2: ty, stroke: "#e6e6ee", "stroke-width": .9 });
        add(svg, "text", { x: plotX-8, y: ty+3.5, "text-anchor": "end", fill: "#444", "font-size": 10.5 }, tick.toFixed(2));
      });
      add(svg, "line", { x1: plotX, x2: plotX, y1: plotY, y2: plotY+plotH, stroke: "#444", "stroke-width": .9 });
      add(svg, "line", { x1: plotX, x2: plotX+plotW, y1: plotY+plotH, y2: plotY+plotH, stroke: "#444", "stroke-width": .9 });

      if (showYLabel) {
        add(svg, "text", { x: x+13, y: plotY+plotH/2, transform: `rotate(-90 ${x+13} ${plotY+plotH/2})`, "text-anchor": "middle", fill: "#333", "font-size": 11 }, "Reward-hack rate");
      }

      const groupW = plotW / panel.models.length;
      const maxBars = Math.max(...panel.models.map(model => visiblePoints(model, conditions).length));
      const barWidth = Math.min(maxBarWidth, (groupW-18) / Math.max(1, maxBars));
      const barGap = Math.min(4, barWidth*.18);

      panel.models.forEach((model, modelIndex) => {
        const points = visiblePoints(model, conditions);
        const clusterW = points.length*barWidth + Math.max(0, points.length-1)*barGap;
        const centerX = plotX + (modelIndex+.5)*groupW;
        let barX = centerX - clusterW/2;

        points.forEach(point => {
          const [rate, low, high] = wilson(point.k, point.n);
          const topY = yScale(rate);
          const baseY = yScale(0);
          add(svg, "rect", { x: barX, y: topY, width: barWidth, height: Math.max(0, baseY-topY), fill: STYLE[point.condition].color });
          const errorX = barX + barWidth/2;
          const lowY = yScale(low);
          const highY = yScale(high);
          add(svg, "line", { x1: errorX, x2: errorX, y1: highY, y2: lowY, stroke: "#fff", "stroke-width": 2.8 });
          add(svg, "line", { x1: errorX-4, x2: errorX+4, y1: highY, y2: highY, stroke: "#fff", "stroke-width": 2.8 });
          add(svg, "line", { x1: errorX-4, x2: errorX+4, y1: lowY, y2: lowY, stroke: "#fff", "stroke-width": 2.8 });
          add(svg, "line", { x1: errorX, x2: errorX, y1: highY, y2: lowY, stroke: STYLE[point.condition].color, "stroke-width": 1.6 });
          add(svg, "line", { x1: errorX-4, x2: errorX+4, y1: highY, y2: highY, stroke: STYLE[point.condition].color, "stroke-width": 1.6 });
          add(svg, "line", { x1: errorX-4, x2: errorX+4, y1: lowY, y2: lowY, stroke: STYLE[point.condition].color, "stroke-width": 1.6 });
          if (showSampleSizes) {
            add(svg, "text", { x: errorX, y: Math.max(plotY+8, highY-5), "text-anchor": "middle", fill: "#555", "font-size": 8 }, (Math.round(point.k * 100 / point.n) / 100).toFixed(2));
          }
          barX += barWidth + barGap;
        });

        add(svg, "text", { x: centerX, y: plotY+plotH+22, "text-anchor": "middle", fill: "#353944", "font-size": 10.5, "font-weight": 700 }, model.model);
      });
    }

    function renderFigure(id, panels, options = {}) {
      const width = options.width || 1180;
      const columns = options.columns || 2;
      const panelHeight = options.panelHeight || 450;
      const rows = Math.ceil(panels.length/columns);
      const side = 10;
      const columnGap = 28;
      const rowGap = 36;
      const top = 76;
      const panelWidth = (width-side*2-columnGap*(columns-1))/columns;
      const height = top + rows*panelHeight + (rows-1)*rowGap + 8;
      const conditions = options.conditions || ORDER;
      const svg = document.getElementById(id);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("xmlns", NS);
      svg.setAttribute("aria-label", options.ariaLabel || options.title || "Reward-hacking rate by prefix condition");
      svg.setAttribute("style", "font-family: Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums");
      add(svg, "title", {}, options.ariaLabel || options.title || "Reward-hacking rate by prefix condition");
      add(svg, "rect", { x: 0, y: 0, width, height, fill: "#fff" });
      add(svg, "text", { x: width/2, y: 21, "text-anchor": "middle", fill: "#222", "font-size": 15, "font-weight": 700 }, options.title || "Reward-hacking rate by prefix condition");
      drawLegend(svg, panels, conditions, width, options.legendLabels);

      panels.forEach((panel, index) => {
        const column = index % columns;
        const row = Math.floor(index/columns);
        drawPanel(svg, panel, {
          x: side + column*(panelWidth+columnGap),
          y: top + row*(panelHeight+rowGap),
          width: panelWidth,
          height: panelHeight
        }, conditions, column === 0, options.panelTitles?.[index], options.showSampleSizes !== false, options.maxBarWidth || 25);
      });
    }

    function prepareAlternative(id, title, width, height) {
      const svg = document.getElementById(id);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("xmlns", NS);
      svg.setAttribute("aria-label", title);
      svg.setAttribute("style", "font-family: Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums");
      add(svg, "title", {}, title);
      add(svg, "rect", { x: 0, y: 0, width, height, fill: "#fff" });
      add(svg, "text", { x: width/2, y: 23, "text-anchor": "middle", fill: "#222", "font-size": 15, "font-weight": 700 }, title);
      return svg;
    }

    function honestPoint(model) {
      return model.points.find(point => ["clean1", "clean2", "clean"].includes(point.condition));
    }

    function differenceInterval(reference, comparison) {
      const referenceRate = reference.k/reference.n;
      const comparisonRate = comparison.k/comparison.n;
      const [, referenceLow, referenceHigh] = wilson(reference.k, reference.n);
      const [, comparisonLow, comparisonHigh] = wilson(comparison.k, comparison.n);
      const difference = comparisonRate-referenceRate;
      const lower = difference-Math.sqrt((comparisonRate-comparisonLow)**2+(referenceHigh-referenceRate)**2);
      const upper = difference+Math.sqrt((comparisonHigh-comparisonRate)**2+(referenceRate-referenceLow)**2);
      return [difference, Math.max(-1, lower), Math.min(1, upper)];
    }

    function drawHoneypotDumbbells(id = "figure-6", panels = [DATA.mlMl, DATA.daDa, DATA.daMl, DATA.mlDa]) {
      const width = 1180;
      const height = 690;
      const svg = prepareAlternative(id, "Prefix effects relative to baseline", width, height);
      drawLegend(svg, panels, ["clean1", "clean2", "clean", "noHoneypot"], width);
      const titles = ["ML → ML", "Data analysis → Data analysis", "Data analysis → ML", "ML → Data analysis"];
      const domain = .8;
      panels.forEach((panel, panelIndex) => {
        const column = panelIndex%2;
        const row = Math.floor(panelIndex/2);
        const boxX = 10+column*590;
        const boxY = 90+row*285;
        const boxW = 570;
        const plotX = boxX+126;
        const plotY = boxY+66;
        const plotW = boxW-158;
        const xScale = value => plotX+((Math.max(-domain, Math.min(domain, value))+domain)/(domain*2))*plotW;
        add(svg, "text", { x: boxX+boxW/2, y: boxY+17, "text-anchor": "middle", fill: "#222", "font-size": 12, "font-weight": 700 }, titles[panelIndex]);
        [-.8, -.4, 0, .4, .8].forEach(tick => {
          const x = xScale(tick);
          add(svg, "line", { x1: x, x2: x, y1: plotY-21, y2: plotY+151, stroke: tick === 0 ? "#777" : "#e6e6ec", "stroke-width": tick === 0 ? 1.4 : .9 });
          add(svg, "text", { x, y: plotY+172, "text-anchor": "middle", fill: "#555", "font-size": 9.5 }, `${tick > 0 ? "+" : ""}${Math.round(tick*100)}`);
        });
        add(svg, "text", { x: xScale(0), y: plotY-27, "text-anchor": "middle", fill: "#666", "font-size": 9.5 }, "baseline RH rate");
        panel.models.filter(model => honestPoint(model)).forEach((model, modelIndex) => {
          const y = plotY+modelIndex*41;
          const baseline = model.points.find(point => point.condition === "baseline");
          const honest = honestPoint(model);
          const noHoneypot = model.points.find(point => point.condition === "noHoneypot");
          add(svg, "text", { x: plotX-14, y: y+3.5, "text-anchor": "end", fill: "#353944", "font-size": 10.5, "font-weight": 700 }, model.model);
          const comparisons = [
            { point: honest, color: STYLE.honest.color, y: y-6 },
            { point: noHoneypot, color: STYLE.noHoneypot.color, y: y+6 }
          ];
          comparisons.forEach(comparison => {
            if (!baseline || !comparison.point) return;
            const [difference, low, high] = differenceInterval(baseline, comparison.point);
            const pointX = xScale(difference);
            add(svg, "line", { x1: xScale(low), x2: xScale(high), y1: comparison.y, y2: comparison.y, stroke: comparison.color, "stroke-width": 1.25, opacity: .85 });
            add(svg, "line", { x1: xScale(low), x2: xScale(low), y1: comparison.y-3, y2: comparison.y+3, stroke: comparison.color, "stroke-width": 1.25, opacity: .85 });
            add(svg, "line", { x1: xScale(high), x2: xScale(high), y1: comparison.y-3, y2: comparison.y+3, stroke: comparison.color, "stroke-width": 1.25, opacity: .85 });
            add(svg, "circle", { cx: pointX, cy: comparison.y, r: 4.8, fill: comparison.color, stroke: "#fff", "stroke-width": 1 });
          });
        });
      });
    }

    renderFigure("figure-1", [inDistributionAggregate], {
      title: "Reward-hacking rates under in-distribution prefixes",
      panelTitles: [false],
      conditions: ["baseline", "hack", "honest"],
      columns: 1,
      width: 860,
      panelHeight: 390,
      maxBarWidth: 42,
      showSampleSizes: true
    });
    renderFigure("figure-2", [DATA.mlMl, DATA.daDa], {
      title: "Reward-hacking rates under in-distribution prefixes",
      panelTitles: ["ML", "Data analysis"],
      conditions: ["baseline", "hack1", "hack2", "clean2", "clean"]
    });
    renderFigure("figure-3", [DATA.logMlMl, DATA.logDaDa], {
      title: "Reward-hacking rates under multi-agent prefixes",
      panelTitles: ["ML", "Data analysis"],
      conditions: ["baseline", "hack1", "hack2", "clean2"],
      legendLabels: { clean2: "Honest prefix" }
    });
    renderFigure("figure-4", [DATA.daMl, DATA.mlDa], {
      title: "Reward-hacking rates under out-of-distribution prefixes",
      panelTitles: ["Data analysis → ML", "ML → Data analysis"],
      conditions: ["baseline", "hack1", "hack2", "clean1", "clean2", "clean"]
    });
    renderFigure("figure-5", [DATA.wikiMl, DATA.wikiDa], {
      title: "Reward-hacking rates under document-summarizing prefixes",
      panelTitles: ["ML", "Data analysis"],
      conditions: ["baseline", "prefix40", "prefix100"]
    });
    drawHoneypotDumbbells(
      "figure-6", [DATA.mlMl, DATA.daDa, DATA.daMl, DATA.mlDa]
    );

  </script>
</body>
</html>
